  read_file: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  get_channels: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  read_channel_messages: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  read_inbox: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  get_users_in_channel: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
