  create_calendar_event: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: INTERNAL, default_risk: MEDIUM}
  cancel_calendar_event: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: INTERNAL, default_risk: MEDIUM}
