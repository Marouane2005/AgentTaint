# Trust and risk registry for AgentDojo (v1.2.1) tools when run behind AgentTaint.
# Content trust is per result: environment data (emails, files, web pages,
# reviews, messages, transactions) is UNTRUSTED_TOOL because that is where
# AgentDojo places its injections. Only the user's own account facts are
# TRUSTED_TOOL. Risk tiers follow the side effect of the tool.

version: 1

defaults:
  result_origin: UNTRUSTED_TOOL
  default_risk: MEDIUM

tools:
  # ---- account facts (trusted results, read-only)
  get_iban: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: TRUSTED_TOOL, default_risk: LOW}
  get_balance: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: TRUSTED_TOOL, default_risk: LOW}
  get_user_info: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: TRUSTED_TOOL, default_risk: LOW}
  get_user_information: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: TRUSTED_TOOL, default_risk: LOW}
  get_current_day: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: TRUSTED_TOOL, default_risk: LOW}

  # ---- reads of environment data (untrusted results)
  get_unread_emails: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  get_sent_emails: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  get_received_emails: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  get_draft_emails: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  search_emails: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  search_contacts_by_name: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  search_contacts_by_email: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  search_calendar_events: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  get_day_calendar_events: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  search_files_by_filename: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  get_file_by_id: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
  list_files: {integration_trust: TRUSTED_TOOL_SERVER, result_origin: UNTRUSTED_TOOL, default_risk: LOW}
