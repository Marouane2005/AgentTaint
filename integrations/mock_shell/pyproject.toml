[project]
name = "agenttaint-mock-shell"
version = "1.0.0"
description = "Docker-sandboxed shell.execute MCP server for AgentTaint"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "mcp>=1.23.0,<2",
]

[project.scripts]
agenttaint-mock-shell = "agenttaint_mock_shell.server:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
