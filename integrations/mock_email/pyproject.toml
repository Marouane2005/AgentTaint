[project]
name = "agenttaint-mock-email"
version = "0.1.0"
description = "Local mock email MCP server for AgentTaint benchmarks"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.23.0,<2",
]

[project.scripts]
agenttaint-mock-email = "agenttaint_mock_email.server:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
