[project]
name = "agenttaint-mock-http"
version = "0.1.0"
description = "Local mock HTTP MCP server for AgentTaint"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.23.0,<2",
]

[project.scripts]
agenttaint-mock-http = "agenttaint_mock_http.server:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
