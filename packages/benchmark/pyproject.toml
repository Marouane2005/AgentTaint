[project]
name = "agenttaint-benchmark"
version = "1.0.0"
description = "Reproducible cross-agent security benchmark for AgentTaint"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "agenttaint-core",
  "agenttaint-provenance",
  "agenttaint-risk",
  "agenttaint-policy",
  "agenttaint-audit",
  "agenttaint-reconstruction",
  "agenttaint-agent-sdk",
  "agenttaint-mcp-proxy",
  "agenttaint-mock-email",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
# External benchmark adapter (scripts/run_agentdojo.py); pinned for reproducibility.
agentdojo = ["agentdojo==0.1.35"]

[project.scripts]
agenttaint-benchmark = "agenttaint_benchmark.__main__:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
