[project]
name = "agenttaint-agent-sdk"
version = "0.1.0"
description = "Instrumented AgentTaint SDK: envelopes, transforms, confirmations"
requires-python = ">=3.12"
dependencies = [
  "agenttaint-core",
  "agenttaint-provenance",
  "agenttaint-policy",
  "agenttaint-audit",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
