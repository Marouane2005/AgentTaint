[project]
name = "agenttaint-policy"
version = "0.1.0"
description = "Deterministic Cedar-backed policy engine for AgentTaint"
requires-python = ">=3.12"
dependencies = [
  "agenttaint-core",
  "agenttaint-provenance",
  "pyyaml>=6.0.2",
  "cedarpy>=4.1,<5",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenttaint_policy = ["cedar/*.cedar", "cedar/*.json"]
