[project]
name = "agenttaint-audit"
version = "1.0.0"
description = "Audit records for AgentTaint enforcement decisions"
requires-python = ">=3.12"
dependencies = [
  "agenttaint-core",
  "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
