[project]
name = "agenttaint-reconstruction"
version = "1.0.0"
description = "Provenance reconstruction evidence channels for AgentTaint"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "agenttaint-core",
  "agenttaint-provenance",
]

[project.optional-dependencies]
semantic = [
  "numpy>=2.0.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
