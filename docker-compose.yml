# AgentTaint 1.0 production stack.
#
#   agenttaint init .            # writes agenttaint.yaml, policies/, .env (mode 600)
#   docker compose up -d --build # postgres + dashboard (API + UI) on 127.0.0.1:8080
#   docker compose run --rm -i proxy   # MCP proxy on stdio (what MCP clients launch)
#
# Every secret is read from .env; compose refuses to start if one is missing.
# Postgres is never published to the host. The dashboard binds to loopback only:
# put a TLS reverse proxy in front of it for remote access.
name: agenttaint

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-agenttaint-env: &agenttaint-env
  AGENTTAINT_DATABASE_URL: "postgresql+psycopg://agenttaint:${POSTGRES_PASSWORD:?run agenttaint init}@postgres:5432/agenttaint"
  AGENTTAINT_SECURITY_DB_URL: "postgresql+psycopg://agenttaint:${POSTGRES_PASSWORD:?run agenttaint init}@postgres:5432/agenttaint"
  AGENTTAINT_CONFIRM_SECRET: "${AGENTTAINT_CONFIRM_SECRET:?run agenttaint init}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenttaint
      POSTGRES_DB: agenttaint
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run agenttaint init}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttaint -d agenttaint"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  # Control plane: REST API and the dashboard UI served from one origin.
  dashboard:
    <<: *hardening
    build: .
    image: agenttaint:1.0.0
    command: ["dashboard", "--config", "/etc/agenttaint/agenttaint.yaml", "--host", "0.0.0.0"]
    environment:
      <<: *agenttaint-env
      AGENTTAINT_DASHBOARD_TOKEN: "${AGENTTAINT_DASHBOARD_TOKEN:?run agenttaint init}"
      AGENTTAINT_APPROVER_TOKEN: "${AGENTTAINT_APPROVER_TOKEN:?run agenttaint init}"
      AGENTTAINT_CORS_ORIGINS: ""
    volumes:
      - ./agenttaint.yaml:/etc/agenttaint/agenttaint.yaml:ro
      - ./policies:/etc/agenttaint/policies:ro
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # MCP proxy. MCP clients start it with `docker compose run --rm -i proxy`
  # (see docs/quickstart.md). It never receives the dashboard/approver tokens.
  proxy:
    <<: *hardening
    profiles: ["proxy"]
    image: agenttaint:1.0.0
    restart: "no"
    stdin_open: true
    command: ["proxy", "--config", "/etc/agenttaint/agenttaint.yaml"]
    environment:
      <<: *agenttaint-env
      HOME: /home/agenttaint
    volumes:
      - ./agenttaint.yaml:/etc/agenttaint/agenttaint.yaml:ro
      - ./policies:/etc/agenttaint/policies:ro
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /home/agenttaint:size=256m,uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
