[project]
name = "agenttaint-workspace"
version = "1.0.0"
description = "Evidence-based information-flow enforcement for AI agents and MCP systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Marouane El Aasri" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "mcp>=1.23.0,<2",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: requires AGENTTAINT_TEST_POSTGRES_URL and psycopg",
  "docker: requires AGENTTAINT_TEST_DOCKER=1 and a Docker daemon",
]
pythonpath = [
  "packages/core/src",
  "packages/provenance/src",
  "packages/risk/src",
  "packages/policy/src",
  "packages/audit/src",
  "packages/mcp_proxy/src",
  "packages/reconstruction/src",
  "packages/agent_sdk/src",
  "packages/benchmark/src",
  "packages/api/src",
  "packages/cli/src",
  "integrations/mock_email/src",
  "integrations/mock_filesystem/src",
  "integrations/mock_http/src",
  "integrations/mock_shell/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/core/src:packages/provenance/src"
packages = ["agenttaint_core", "agenttaint_provenance"]
