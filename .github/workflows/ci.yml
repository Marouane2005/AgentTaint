name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package workspace
        run: make install

      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: python3 -m ruff format --check packages integrations tests scripts

      - name: Typecheck
        run: |
          python3 -m pip install types-networkx
          make typecheck

      - name: Pytest
        env:
          PYTHONHASHSEED: "0"
        run: make test

  dashboard:
    name: Dashboard (vitest, eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
                    # Node 22 avoids undici decompress.bind crash under Vitest on Node 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Vitest
        run: npm test

      - name: ESLint
        run: npm run lint
